name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # -eo pipefail, on every OS

# Actions are pinned to commit SHAs (Dependabot keeps them current: .github/dependabot.yml).
jobs:
  lint:
    name: Lint (workflows, launcher, Hermes shim, plugin manifests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint -color
      # Every plugin carries the same launcher (test/packaging.test.ts), so checking one covers them all.
      # Warnings and errors only: the one info note (SC2015) is `a && b=… || c`, where the assignment can't fail.
      - name: shellcheck (POSIX sh launcher)
        run: shellcheck --shell=sh --severity=warning adapters/claude-code/scripts/ss33
      # Broad exception handlers are deliberate there (a hook must never break a turn), so B/BLE stay narrow.
      - name: ruff (Hermes shim, Python 3.11+)
        run: pipx run ruff==0.17.6 check --isolated --target-version py311 --select E,F,W,B,UP --ignore E501 adapters/hermes
      - name: claude plugin validate
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.331 plugin validate adapters/claude-code --strict
          npx --yes @anthropic-ai/claude-code@2.1.331 plugin validate .

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 22 is the floor (package.json engines); Hermes needs Python 3.11+.
          - { os: ubuntu-latest, node: 22, python: "3.11" }
          - { os: ubuntu-latest, node: 24, python: "3.13" }
          - { os: ubuntu-latest, node: 26, python: "3.14", coverage: true }
          - { os: macos-latest, node: 24, python: "3.13" }
          - { os: windows-latest, node: 24, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The Hermes shim tests (test/hermes.test.ts) run it with python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: npm test
      - name: Tests with coverage (fails under the thresholds in package.json)
        if: ${{ matrix.coverage }}
        run: mkdir -p coverage && npm run test:coverage | tee coverage/report.txt
      - name: Coverage summary
        if: ${{ matrix.coverage && !cancelled() }}
        run: |
          {
            echo "### Coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage/report.txt | sed 's/^ℹ //' | grep -v 'coverage report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.coverage && !cancelled() }}
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  # Plugins are installed by copying their folder, so every adapters/* plugin carries the built bundle.
  bundle:
    name: Shipped bundle is fresh and runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bundle and launcher copies are up to date in every plugin
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- adapters)" ]; then
            git status --short -- adapters
            git diff --stat -- adapters
            echo "::error::Run 'npm run build' and commit the result in every adapters/* plugin"
            exit 1
          fi
      - name: Bundle runs through the launcher
        run: adapters/claude-code/scripts/ss33 version
      - name: End-to-end tests against the shipped bundle
        run: |
          npm run build:test
          SS33_E2E_BIN=adapters/claude-code/lib/ss33.cjs node --test build/test/e2e-cli.test.js

  # The launcher must work for users without Node.js: it downloads the pinned official build.
  # Runners have Node installed, so SS33_NO_SYSTEM_NODE=1 makes the launcher ignore it.
  launcher:
    name: Launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SS33_NO_SYSTEM_NODE: "1"
      SS33_RUNTIME_DIR: ${{ github.workspace }}/.ss33-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: First run downloads and verifies Node.js
        run: sh adapters/claude-code/scripts/ss33 version
      - name: Hermes on Windows runs it with MSYS path conversion off
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
          SS33_RUNTIME_DIR: ${{ runner.temp }}/ss33-noconv
        run: |
          sh adapters/hermes/scripts/ss33 version
          sh adapters/hermes/scripts/ss33 version
          SS33_HOST_NODE="$(cygpath -m "$(command -v node)")" SS33_RUNTIME_DIR="${{ runner.temp }}/ss33-host" sh adapters/hermes/scripts/ss33 version
      - name: Second run uses the cached runtime
        run: |
          out=$(sh adapters/claude-code/scripts/ss33 fingerprint 2>&1)
          echo "$out"
          if echo "$out" | grep -q downloading; then echo "::error::downloaded twice"; exit 1; fi
      - name: Every plugin's prompt hook exits 0 silently
        run: |
          payload='{"session_id":"ci","sessionId":"ci","turn_id":"t","cwd":"'"$PWD"'","prompt":"hi"}'
          while read -r plugin harness event; do
            out=$(echo "$payload" | SS33_MATCH=0 sh "adapters/$plugin/scripts/ss33" hook "$harness" "$event")
            if [ -n "$out" ]; then echo "::error::$plugin hook printed: $out"; exit 1; fi
          done <<'EOF'
          claude-code claude-code user-prompt-submit
          codex codex user-prompt-submit
          copilot copilot user-prompt-submitted
          dsh dsh pre-step
          hermes hermes pre-llm-call
          EOF

  # One required check for branch protection, whatever the matrix becomes.
  ci-ok:
    name: CI passed
    if: ${{ always() }}
    needs: [lint, test, bundle, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Allow-list, not deny-list: a matrix job that never got a runner reports "abandoned", not "cancelled".
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
