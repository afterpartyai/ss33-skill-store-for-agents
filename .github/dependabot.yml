version: 2
updates:
  # The workflow pins actions to commit SHAs; this keeps them (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Dev dependencies only (the plugin itself has none). Minor and patch updates come as one grouped PR a
  # month; a major version gets a PR of its own, so it can wait without holding the routine ones up.
  # esbuild builds the shipped bundle: if its output changes, CI's bundle check fails until `npm run build`
  # is committed to the PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        update-types: ["minor", "patch"]
    ignore:
      # Stay at or below the Node floor in package.json engines; bump them together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
